name: Inventory and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply Facebook updates and publish (unchecked = preview only)'
        type: boolean
        default: false

# Serialize manual edits, scheduled syncs, and deployments.
concurrency:
  group: inventory-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name != 'schedule' || vars.FACEBOOK_SYNC_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - name: Choose preview or publish
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$EVENT" = push ] || [ "$EVENT" = schedule ] || [ "$APPLY" = true ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Read Facebook inventory
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_USER_ID: ${{ vars.FACEBOOK_USER_ID }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            npm run sync:apply
          else
            npm run sync:preview
          fi
      - name: Save inventory changes
        if: >-
          steps.mode.outputs.publish == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/inventory.json assets/cars/facebook .inventory-sync/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update inventory from authorized Facebook posts'
            git push origin HEAD:main
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: steps.mode.outputs.publish == 'true'
        with:
          path: dist

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
